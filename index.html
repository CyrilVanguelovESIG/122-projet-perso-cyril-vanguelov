<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise des Lakers | Roaster</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->
<header>
    <h1>Lakers Players</h1>
    <p>Roster interactif des Lakers</p>
</header>

<!-- ==========================================
     NAV
========================================== -->
<nav>
    <ul>
        <li><a href="#joueurs-container">Roster</a></li>
        <li><a href="#formulaire-ajout">Ajouter un joueur</a></li>
    </ul>
</nav>

<!-- ==========================================
     MAIN
========================================== -->
<main>

    <!-- CONTROLS -->
    <section class="controls">

        <div class="control-group">
            <label for="recherche">Rechercher</label>
            <input
                    type="text"
                    id="recherche"
                    placeholder="Rechercher un joueur..."
            >
        </div>

        <div class="control-group">
            <label for="filtreStat">Filtrer par stats</label>
            <select id="filtreStat">
                <option value="all">Toutes les stats</option>
                <option value="points">Points &gt; 20</option>
                <option value="rebonds">Rebonds &gt; 8</option>
                <option value="assists">Assists &gt; 5</option>
            </select>
        </div>

        <div class="control-group">
            <label for="filtrePoste">Filtrer par poste</label>
            <select id="filtrePoste">
                <option value="all">Tous les postes</option>
                <option value="MJ">Meneur (MJ)</option>
                <option value="AR">Arrière (AR)</option>
                <option value="AI">Ailier (AI)</option>
                <option value="AF">Ailier Fort (AF)</option>
                <option value="P">Pivot (P)</option>
                <option value="C">Coach (C)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="tri">Trier par</label>
            <select id="tri">
                <option value="nom">Nom</option>
                <option value="poste">Poste</option>
                <option value="age">Âge</option>
                <option value="taille">Taille</option>
                <option value="points">Points</option>
            </select>
        </div>

    </section>

    <!-- GRID -->
    <section
            id="joueurs-container"
            class="players-grid"
    ></section>

    <!-- FORMULAIRE D'AJOUT -->
    <section class="form-section" id="formulaire-ajout">

        <h2>Ajouter un joueur</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="input-nom">Nom *</label>
                <input type="text" id="input-nom" placeholder="Ex : Anthony Davis">
            </div>

            <div class="form-group">
                <label for="input-poste">Poste *</label>
                <select id="input-poste">
                    <option value="">-- Choisir --</option>
                    <option value="MJ">Meneur (MJ)</option>
                    <option value="AR">Arrière (AR)</option>
                    <option value="AI">Ailier (AI)</option>
                    <option value="AF">Ailier Fort (AF)</option>
                    <option value="P">Pivot (P)</option>
                    <option value="C">Coach (C)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="input-age">Âge *</label>
                <input type="number" id="input-age" placeholder="Ex : 30" min="18" max="60">
            </div>

            <div class="form-group">
                <label for="input-taille">Taille (cm) *</label>
                <input type="number" id="input-taille" placeholder="Ex : 208" min="150" max="230">
            </div>

            <div class="form-group">
                <label for="input-points">Points / match</label>
                <input type="number" id="input-points" placeholder="Ex : 18.5" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label for="input-rebonds">Rebonds / match</label>
                <input type="number" id="input-rebonds" placeholder="Ex : 7.2" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label for="input-assists">Assists / match</label>
                <input type="number" id="input-assists" placeholder="Ex : 3.4" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label for="input-image">URL image</label>
                <input type="text" id="input-image" placeholder="images/joueur.jpg">
            </div>

        </div>

        <div class="form-error" id="form-error"></div>

        <button id="btn-ajouter" class="btn-primary">
            + Ajouter au roster
        </button>

    </section>

</main>

<!-- ==========================================
     FOOTER
========================================== -->
<footer>
    <p>&copy; 2025 Lakers Players — Roster interactif</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
